# Publica o portfólio no GitHub Pages a cada push na main, ou à mão em Actions > Pages > Run workflow.
# O Next exporta o site estático em out/ (output: "export" no next.config.ts), servido em /portfolio.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Uma publicação por vez; a que está no meio termina antes da próxima começar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Exportação estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Publicação
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
